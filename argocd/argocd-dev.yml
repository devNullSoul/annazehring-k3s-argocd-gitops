apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/devNullSoul/annazehring-k3s-argocd-gitops.git
    targetRevision: master
    path: kustomize/overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: demo-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true